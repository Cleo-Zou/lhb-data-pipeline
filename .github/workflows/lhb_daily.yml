name: LHB Daily

on:
  schedule:
    # UTC 08:00 = 北京时间 16:00，周一至周五
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '手动指定日期 YYYYMMDD 或 YYYY-MM-DD（留空则取昨天）'
        required: false
        type: string
      backfill:
        description: '回补最近 N 天历史（0=不回补，首次攒历史建议填 60）'
        required: false
        default: '0'
        type: string

permissions:
  contents: write     # 把 data/ 提交回仓库，历史靠这个累积
  pages: write        # 部署 GitHub Pages
  id-token: write     # deploy-pages 需要 OIDC

# Pages 部署不可并发；这里还要提交数据，中途取消会留下脏状态，所以不取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 兜底层：万一某次 push 冲突没提交上，下次运行仍能从缓存拿回历史
      - name: 恢复数据缓存
        uses: actions/cache@v4
        with:
          path: data/
          key: lhb-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lhb-data-${{ runner.os }}-

      - name: 抓取数据并生成看板
        env:
          # 经环境变量传入，不要直接把 inputs 插值进 run 里（脚本注入风险）
          LHB_DATE: ${{ inputs.date }}
          LHB_BACKFILL: ${{ inputs.backfill }}
        run: |
          args=(--no-email)
          if [ -n "$LHB_DATE" ]; then
            args+=(--date "$LHB_DATE")
          fi
          if [ -n "$LHB_BACKFILL" ] && [ "$LHB_BACKFILL" != "0" ]; then
            args+=(--backfill "$LHB_BACKFILL")
          fi
          python fetch_lhb.py "${args[@]}"

      - name: 汇总本地历史
        run: |
          echo "已归档 $(ls data/lhb_*.parquet 2>/dev/null | wc -l) 个交易日"
          ls -1 data/lhb_*.parquet 2>/dev/null | tail -3 || true

      - name: 提交数据到仓库
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无新增数据，跳过提交"
          else
            git commit -m "data: 龙虎榜数据更新 $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "push 失败（冲突或权限），数据已进缓存，下次运行可恢复"
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true      # 仓库没开 Pages 时自动开启，省掉手动设置

      - name: 上传产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 邮件必须在部署之后发，才拿得到 page_url
      - name: 发送邮件
        if: success()
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          LHB_DATE: ${{ inputs.date }}
        run: |
          args=(--email-only)
          if [ -n "$LHB_DATE" ]; then
            args+=(--date "$LHB_DATE")
          fi
          python fetch_lhb.py "${args[@]}"

      - name: 上传产物存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhb-data
          path: |
            data/*.parquet
            output/index.html
          retention-days: 30
          if-no-files-found: ignore
