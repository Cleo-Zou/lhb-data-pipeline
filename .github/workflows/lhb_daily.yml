name: LHB Daily

on:
  schedule:
    # UTC 08:00 = 北京时间 16:00，周一至周五
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '手动指定日期 YYYYMMDD（留空则取昨天）'
        required: false
        type: string

# 同一时间只跑一个实例，避免手动触发与定时任务撞车
concurrency:
  group: lhb-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch LHB data and send email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # 经环境变量传入，不要直接把 inputs 插值进 run 里（脚本注入风险）
          LHB_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$LHB_DATE" ]; then
            python fetch_lhb.py --date "$LHB_DATE"
          else
            python fetch_lhb.py
          fi

      # 兜底：即使邮件发送失败，数据仍可从 Actions 页面下载（保留 30 天）
      - name: Upload parquet as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhb-data
          path: data/*.parquet
          retention-days: 30
          if-no-files-found: ignore
